name: Post to Instagram

# Runs around 8:00 and 19:00 New York time (both daylight-saving offsets covered).
# run.py decides whether a slot is actually due, so extra runs are harmless.
on:
  schedule:
    - cron: "7 12,13,14,23,0,1 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Testing only: pretend local New York time, e.g. 2026-11-16T08:10"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.prep.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autopost/requirements.txt
      - run: pip install -r autopost/requirements.txt
      - id: prep
        run: python autopost/run.py prepare
        env:
          NOW: ${{ inputs.now }}
      - if: steps.prep.outputs.due == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.prep.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: job
          path: .job.json
          include-hidden-files: true

  publish:
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: job
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until the media is reachable
        run: |
          for i in $(seq 1 30); do
            curl -fsI "${{ steps.deploy.outputs.page_url }}index.html" >/dev/null && exit 0
            sleep 5
          done
          echo "Pages site not reachable" && exit 1
      - name: Publish
        run: python autopost/run.py publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
      - name: Save what was posted
        run: |
          git config user.name "7rage bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "posted $(python -c 'import json;print(json.load(open(".job.json"))["slot"])')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
